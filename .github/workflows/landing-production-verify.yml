name: Landing production verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      production_url:
        description: HTTPS production origin
        required: true
        type: string
      expected_commit_sha:
        description: Expected production commit SHA
        required: true
        type: string
      landing_slug:
        description: Optional single agent-release slug; empty verifies every agent release
        required: false
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha || github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve verification inputs
        id: inputs
        env:
          MANUAL_URL: ${{ inputs.production_url }}
          MANUAL_SHA: ${{ inputs.expected_commit_sha }}
          CANONICAL_ORIGIN: https://vettedsaasblueprint.online
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          url="${MANUAL_URL:-$CANONICAL_ORIGIN}"
          sha="${MANUAL_SHA:-$DEPLOYMENT_SHA}"
          test -n "$url" && test -n "$sha"
          case "$url" in https://*) ;; *) exit 1 ;; esac
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Install locked Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify commit, route, exact CTA, disclosure, robots, sitemap, and responsive rendering
        env:
          URL: ${{ steps.inputs.outputs.url }}
          EXPECTED_SHA: ${{ steps.inputs.outputs.sha }}
          LANDING_SLUG: ${{ inputs.landing_slug }}
        run: |
          args=(--origin "$URL" --expected-sha "$EXPECTED_SHA" --screenshot-dir .stage2/landing-production)
          if [ -n "$LANDING_SLUG" ]; then args+=(--slug "$LANDING_SLUG"); fi
          npm run landing:verify:deployment -- "${args[@]}"
      - name: Upload production verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-production-verification
          path: .stage2/landing-production
