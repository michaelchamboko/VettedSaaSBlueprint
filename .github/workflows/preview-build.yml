name: Preview Build

on:
  push:
    branches:
      - main
      - codex/step-2-build
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
