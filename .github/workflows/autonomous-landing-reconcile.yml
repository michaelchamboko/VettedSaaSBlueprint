name: Autonomous landing reconciliation

on:
  push:
    branches: [main]
    paths:
      - approved-urls.md
      - src/lib/landing-automation/**
      - scripts/validate-approved-urls.ts
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      allow_bulk_allowlist_revocation:
        description: Explicitly permit a broad allowlist removal.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run landing:allowlist:validate
      - run: npm run landing:workflow:describe -- --json
      - name: Dispatch signed reconciliation request to Hermes
        env:
          HERMES_RECONCILE_ENDPOINT: ${{ secrets.HERMES_RECONCILE_ENDPOINT }}
          HERMES_RECONCILE_TOKEN: ${{ secrets.HERMES_RECONCILE_TOKEN }}
          ALLOW_BULK_ALLOWLIST_REVOCATION: ${{ inputs.allow_bulk_allowlist_revocation || 'false' }}
        run: |
          test -n "$HERMES_RECONCILE_ENDPOINT"
          test -n "$HERMES_RECONCILE_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST "$HERMES_RECONCILE_ENDPOINT" \
            --header "Authorization: Bearer $HERMES_RECONCILE_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"source_commit_sha\":\"${GITHUB_SHA}\",\"allow_bulk_allowlist_revocation\":${ALLOW_BULK_ALLOWLIST_REVOCATION}}"
